name: Orchard Core Contrib Testing - Build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'README.md'

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        token: ${{ secrets.OCC_TOKEN }}
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.*
          10.0.*

    - name: Install Dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Install Playwright browsers
      shell: pwsh
      run: |
        $playwrightScript = Get-ChildItem "test/OrchardCoreContrib.Testing.UI.Tests/bin/Release/*/playwright.ps1" |
          Select-Object -First 1 -ExpandProperty FullName

        if ([string]::IsNullOrWhiteSpace($playwrightScript)) {
          throw "Unable to find playwright.ps1 in the built UI test output."
        }

        & $playwrightScript install

    - name: Test
      run: dotnet test --configuration Release --no-restore --verbosity normal
